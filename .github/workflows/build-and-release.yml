name: Build and release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Build universal app and ZIP
        run: ./scripts/package-release.sh
      - name: Verify package
        run: |
          lipo -info "build/Microphone Choice.app/Contents/MacOS/MicChoice"
          codesign --verify --deep --strict "build/Microphone Choice.app"
          "build/Microphone Choice.app/Contents/MacOS/MicChoice" --probe
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "repos/$GITHUB_REPOSITORY/releases/generate-notes" \
            -f "tag_name=$GITHUB_REF_NAME" --jq '.body' > build/generated-notes.md
          cat .github/release-intro.md build/generated-notes.md > build/release-notes.md
          gh release create "$GITHUB_REF_NAME" build/Microphone-Choice-*-macos-universal.zip \
            --title "$GITHUB_REF_NAME" --notes-file build/release-notes.md --verify-tag
